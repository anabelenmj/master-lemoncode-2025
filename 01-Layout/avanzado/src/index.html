<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Warner Live</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="mystyle.scss" />

</head>

<body>
  <header class="header">
    <div class="header-logo">
      <img src="assets/logo-wb.svg" />
      <span class="header-logo-title">Warner Live</span>
    </div>

    <nav class="header-nav">
      <ul class="header-nav-list">
        <li class="header-nav-list-element"><a href="#">Inicio</a></li>
        <li class="header-nav-list-element"><a href="#">Buscar</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="popular-row">
      <h1 class="popular-title">Los <span id="top-text">5</span> más populares hoy</h1>

      <div class="popular-items">
        <div class="popular-item"><img src="assets/top/1.webp" /></div>
        <div class="popular-item"><img src="assets/top/2.webp" /></div>
        <div class="popular-item"><img src="assets/top/3.webp" /></div>
        <div class="popular-item"><img src="assets/top/4.webp" /></div>
        <div class="popular-item"><img src="assets/top/5.webp" /></div>
      </div>
    </section>


    <section class="standar-row">
      <h2 class="standar-title">Comedias</h2>
      <div class="standar-items">
        <div class="standar-item"><img src="assets/line-2/1.webp" /></div>
        <div class="standar-item"><img src="assets/line-2/2.webp" /></div>
        <div class="standar-item"><img src="assets/line-2/3.webp" /></div>
        <div class="standar-item"><img src="assets/line-2/4.webp" /></div>
        <div class="standar-item"><img src="assets/line-2/5.webp" /></div>
        <div class="standar-item"><img src="assets/line-2/6.webp" /></div>
      </div>
    </section>

    <section class="standar-row">
      <h2 class="standar-title">Dramas basados en libros</h2>
      <div class="standar-items">
        <div class="standar-item"><img src="assets/line-1/1.webp" /></div>
        <div class="standar-item"><img src="assets/line-1/2.webp" /></div>
        <div class="standar-item"><img src="assets/line-1/3.webp" /></div>
        <div class="standar-item"><img src="assets/line-1/4.webp" /></div>
        <div class="standar-item"><img src="assets/line-1/5.webp" /></div>
        <div class="standar-item"><img src="assets/line-1/6.webp" /></div>
      </div>
    </section>
  </main>
  <footer></footer>
</body>

</html>
