<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Warner Live</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./src/mystyle.scss" />

</head>

<body>
  <header class="header">
    <div class="header-logo">
      <a href="#">
        <img src="src/assets/logo-wb.svg" alt="Logo Warner Bros"/>
        <span class="header-logo-title">Warner Live</span>
      </a>
    </div>

    <nav class="header-nav">
      <ul class="header-nav-list">
        <li class="header-nav-list-element"><a href="#">Inicio</a></li>
        <li class="header-nav-list-element"><a href="#">Buscar</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-page">
    <section class="popular-row">
      <h1 class="popular-title">Los <span id="top-text"></span> más populares hoy</h1>

      <div class="popular-items">
        <div class="popular-item"><img src="src/assets/top/1.webp" alt="Carátula serie destacada 'El Último Baile'"/></div>
        <div class="popular-item"><img src="src/assets/top/2.webp" alt="Carátula serie destacada 'A Tres Metros Sobre el Cielo: La serie'"/></div>
        <div class="popular-item"><img src="src/assets/top/3.webp" alt="Carátula serie destacada 'Dangerous Lies'"/></div>
        <div class="popular-item"><img src="src/assets/top/4.webp" alt="Carátula serie destacada 'Yo Nunca'"/></div>
        <div class="popular-item"><img src="src/assets/top/5.webp" alt="Carátula serie destacada 'The Last Kingdom'"/></div>
      </div>
    </section>


    <section class="standar-row">
      <h2 class="standar-title">Comedias</h2>
      <div class="standar-items">
        <div class="standar-item"><img src="src/assets/line-2/1.webp" alt="Carátula serie comedia 'Los 100'"/></div>
        <div class="standar-item"><img src="src/assets/line-2/2.webp" alt="Carátula serie comedia 'American Crime Story'"/></div>
        <div class="standar-item"><img src="src/assets/line-2/3.webp" alt="Carátula serie comedia 'Midhunter'"/></div>
        <div class="standar-item"><img src="src/assets/line-2/4.webp" alt="Carátula serie comedia 'Altered Carbon'"/></div>
        <div class="standar-item"><img src="src/assets/line-2/5.webp" alt="Carátula serie comedia 'Por Trece Razones'"/></div>
        <div class="standar-item"><img src="src/assets/line-2/6.webp" alt="Carátula serie comedia 'The Witcher'"/></div>
      </div>
    </section>

    <section class="standar-row">
      <h2 class="standar-title">Dramas basados en libros</h2>
      <div class="standar-items">
        <div class="standar-item"><img src="src/assets/line-1/1.webp" alt="Carátula serie dramas basados en libros '¡Tú la llevas! [Tag]'"/></div>
        <div class="standar-item"><img src="src/assets/line-1/2.webp" alt="Carátula serie dramas basados en libros 'El Gran Stan"/></div>
        <div class="standar-item"><img src="src/assets/line-1/3.webp" alt="Carátula serie dramas basados en libros 'Sherlock Holmes Juego de Sombras'"/></div>
        <div class="standar-item"><img src="src/assets/line-1/4.webp" alt="Carátula serie dramas basados en libros 'Noche de Juegos'"/></div>
        <div class="standar-item"><img src="src/assets/line-1/5.webp" alt="Carátula serie dramas basados en libros 'Salidos de Cuentas'"/></div>
        <div class="standar-item"><img src="src/assets/line-1/6.webp" alt="Carátula serie dramas basados en libros 'Novia por Contrato'"/></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div>
      <p>Plataforma realizada por © <a href="https://github.com/anabelenmj" target="_blank">Eiby</a> </p>
    </div>
  </footer>
  <script type="module" src="/src/main.js"></script>

</body>

</html>
